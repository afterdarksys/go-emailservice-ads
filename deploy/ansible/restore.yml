---
- name: Verify and stage a mailhub restore
  hosts: emailservers
  become: yes
  vars_prompt:
    - name: backup_file
      prompt: "Verified mailhub data archive path"
      private: no
    - name: restore_data_dir
      prompt: "New, nonexistent restore directory (never live data)"
      private: no
  tasks:
    - name: Verify checksums and SQLite integrity
      ansible.builtin.command:
        argv: [mailhub-backup, verify, --archive, "{{ backup_file }}"]
      changed_when: false
    - name: Restore into a new directory without replacing live data
      ansible.builtin.command:
        argv: [mailhub-backup, restore, --archive, "{{ backup_file }}", --data-dir, "{{ restore_data_dir }}"]
    - name: Record activation requirements
      ansible.builtin.debug:
        msg: "Restore staged. Fence/stop the old hub, restore matching configuration/secrets and any external identity DB, then activate this directory. See docs/BACKUP_RECOVERY.md."
