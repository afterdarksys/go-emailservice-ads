# One owner per mail spool. Do not scale this Deployment horizontally.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smtp-perimeter-data
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-perimeter
  namespace: mail-system
  labels:
    app: smtp
    component: perimeter-mta
    tier: edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smtp
      component: perimeter-mta
  template:
    metadata:
      labels:
        app: smtp
        component: perimeter-mta
        tier: edge
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
        prometheus.io/scheme: https
    spec:
      serviceAccountName: smtp-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: smtp
                  component: perimeter-mta
              topologyKey: topology.kubernetes.io/zone
      containers:
      - name: smtp
        image: goemailservices:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: POD_REGION
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['topology.kubernetes.io/region']
        - name: POD_ZONE
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['topology.kubernetes.io/zone']
        - name: MAILHUB_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: smtp-admin
              key: admin-key
        - name: MAILHUB_DIRECTORY_KEY
          valueFrom:
            secretKeyRef:
              name: smtp-admin
              key: directory-key
        ports:
        - name: smtp
          containerPort: 25
          protocol: TCP
        - name: http-api
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
          readOnlyRootFilesystem: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: config
          mountPath: /etc/smtp
          readOnly: true
        - name: tls
          mountPath: /etc/tls
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        args:
        - --config
        - /etc/smtp/config.yaml
      volumes:
      - name: config
        configMap:
          name: smtp-perimeter-config
      - name: tls
        secret:
          secretName: smtp-tls
      - name: data
        persistentVolumeClaim:
          claimName: smtp-perimeter-data
      - name: tmp
        emptyDir: {}
