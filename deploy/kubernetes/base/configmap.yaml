        window: 1m
        messages_per_window: 120
        recipients_per_window: 1000
        global_messages_per_window: 2000
        duplicate_limit: 20
        trip_after: 3
        cooldown: 5m
        max_cooldown: 1h
        baseline_windows: 5
        anomaly_factor: 4
        anomaly_floor: 20
        max_identities: 10000
      clamav_address: clamav:3310
      malware_required: true
    imap:
      addr: :1143
      tls:
        cert: /etc/tls/tls.crt
        key: /etc/tls/tls.key
      tls_mode: starttls
      disabled: true
    api:
      rest_addr: :8080
      grpc_addr: :50051
      tls:
        cert: /etc/tls/tls.crt
        key: /etc/tls/tls.key
      api_keys:
      - name: admin
        key_env: MAILHUB_ADMIN_KEY
        permissions:
        - '*'
      - name: perimeter-directory
        key_env: MAILHUB_DIRECTORY_KEY
        permissions:
        - recipients:read
    auth:
      user_database_url: /data/users.db
      default_users: []
    logging:
      level: info
  policies.yaml: |
    policies: []
