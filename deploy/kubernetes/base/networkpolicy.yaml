apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smtp-perimeter-netpol
  namespace: mail-system
spec:
  podSelector:
    matchLabels:
      component: perimeter-mta
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 25
    - protocol: TCP
      port: 587
    - protocol: TCP
      port: 465
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          component: internal-hub
    ports:
    - protocol: TCP
      port: 2525
  - to:
    - podSelector:
        matchLabels:
          component: etcd
    ports:
    - protocol: TCP
      port: 2379
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 25
    - protocol: TCP
      port: 587
  - to:
    - podSelector:
        matchLabels:
          component: internal-hub
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - podSelector:
        matchLabels:
          app: rspamd
    ports:
    - protocol: TCP
      port: 11333
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: clamav
    ports:
    - protocol: TCP
      port: 3310
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smtp-internal-netpol
  namespace: mail-system
spec:
  podSelector:
    matchLabels:
      component: internal-hub
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          component: perimeter-mta
    ports:
    - protocol: TCP
      port: 2525
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 587
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
  - from:
    - podSelector:
        matchLabels:
          component: perimeter-mta
    ports:
    - protocol: TCP
      port: 8080
