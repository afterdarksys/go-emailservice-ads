# One owner per mail spool. Do not scale this Deployment horizontally.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smtp-internal-data
  namespace: mail-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-internal
  namespace: mail-system
  labels:
    app: smtp
    component: internal-hub
    tier: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smtp
      component: internal-hub
  template:
    metadata:
      labels:
        app: smtp
        component: internal-hub
        tier: backend
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
        prometheus.io/scheme: https
    spec:
      serviceAccountName: smtp-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: smtp
        image: goemailservices:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MAILHUB_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: smtp-admin
              key: admin-key
        - name: MAILHUB_DIRECTORY_KEY
          valueFrom:
            secretKeyRef:
              name: smtp-admin
              key: directory-key
        ports:
        - name: internal-smtp
          containerPort: 2525
          protocol: TCP
        - name: submission
          containerPort: 587
          protocol: TCP
        - name: imap
          containerPort: 1143
          protocol: TCP
        - name: http-api
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /etc/smtp
          readOnly: true
        - name: tls
          mountPath: /etc/tls
          readOnly: true
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        args:
        - --config
        - /etc/smtp/config.yaml
      volumes:
      - name: config
        configMap:
          name: smtp-internal-config
      - name: tls
        secret:
          secretName: smtp-tls
      - name: data
        persistentVolumeClaim:
          claimName: smtp-internal-data
      - name: tmp
        emptyDir: {}
